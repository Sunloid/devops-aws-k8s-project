apiVersion: v1
kind: Secret
metadata:
  name: todo-app-secret
type: Opaque
stringData:
  # DO NOT put real credentials in this file - it's committed to git.
  # Copy this file to secret.yaml (already in .gitignore) and fill in
  # your real MongoDB Atlas connection string there instead.
  mongo-uri: "mongodb+srv://<username>:<password>@<cluster-url>/todo_app?retryWrites=true&w=majority"