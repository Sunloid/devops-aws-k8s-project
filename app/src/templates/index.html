<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps Practice - To-Do App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>

        <form action="/add" method="POST" class="add-form">
            <input type="text" name="task" placeholder="Add a new task..." required>
            <button type="submit">Add</button>
        </form>

        <ul class="todo-list">
            {% for todo in todos %}
            <li class="{{ 'done' if todo.done else '' }}">
                <span>{{ todo.task }}</span>
                <div class="actions">
                    <a href="/toggle/{{ todo._id }}">✔</a>
                    <a href="/delete/{{ todo._id }}">✖</a>
                </div>
            </li>
            {% else %}
            <li class="empty">No tasks yet. Add one above!</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
